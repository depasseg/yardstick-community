# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Publishes ghcr.io/<owner>/yardstick:<version> whenever the vendor ships a new version.
# Every 6 hours: download the .deb, read its Version, and build + push if that tag doesn't
# exist yet. Pull requests only build. See README.md.
name: Build

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and push even if the tag already exists"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yardstick
  DEB_URL: https://yardstickhome.com/download/yardstick_amd64.deb

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the vendor package version
        id: deb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/yardstick_amd64.deb "$DEB_URL"
          version=$(dpkg-deb -f /tmp/yardstick_amd64.deb Version)
          [ "$(dpkg-deb -f /tmp/yardstick_amd64.deb Architecture)" = amd64 ]
          # The version becomes an image tag: allow only a plain version number.
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+(\.[0-9]+){1,3}'; then
            echo "::error::unexpected package version: $version"; exit 1
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum /tmp/yardstick_amd64.deb | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this version already published?
        id: exists
        if: github.event_name != 'pull_request'
        env:
          FORCE: ${{ inputs.force }}
          VERSION: ${{ steps.deb.outputs.version }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          build-args: |
            YARDSTICK_VERSION=${{ steps.deb.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.deb.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.deb.outputs.version }}
            io.yardstick.deb.sha256=${{ steps.deb.outputs.sha256 }}

      - name: Summary
        env:
          VERSION: ${{ steps.deb.outputs.version }}
          SHA256: ${{ steps.deb.outputs.sha256 }}
          SKIP: ${{ steps.exists.outputs.skip }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "Yardstick **$VERSION** (deb sha256 \`$SHA256\`)"
            if [ "$EVENT" = "pull_request" ]; then echo "Test build only, **not pushed** (pull request)."
            elif [ "$SKIP" = "true" ]; then echo "\`$IMAGE:$VERSION\` already published, skipped."
            else echo "Built and pushed \`$IMAGE:$VERSION\`."; fi
          } >> "$GITHUB_STEP_SUMMARY"
