# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Publishes ghcr.io/<owner>/yardstick-community:<version> (amd64 + arm64) whenever the vendor
# ships a new version. Every 6 hours: read the vendor release list, and build + push if that
# tag doesn't exist yet. The Dockerfile verifies each .deb's SHA-256 against the list. Pull requests only build. See README.md.
name: Build

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and push even if the tag already exists"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yardstick-community
  RELEASE_URL: https://yardstickhome.com/release/latest.json

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy results -> the Security tab (code scanning)
      id-token: write          # keyless cosign signature (Sigstore) of the pushed image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the vendor release list
        id: release
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o release.json "$RELEASE_URL"
          version=$(jq -er .version release.json)
          # The version becomes an image tag: allow only a plain version number.
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+(\.[0-9]+){1,3}'; then
            echo "::error::unexpected release version: $version"; exit 1
          fi
          for arch in amd64 arm64; do jq -er ".linux.$arch.url, .linux.$arch.sha256" release.json >/dev/null; done
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "sha256_amd64=$(jq -er .linux.amd64.sha256 release.json)" | tee -a "$GITHUB_OUTPUT"
          echo "sha256_arm64=$(jq -er .linux.arm64.sha256 release.json)" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this version already published?
        id: exists
        if: github.event_name != 'pull_request'
        env:
          FORCE: ${{ inputs.force }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (arm64 build on the amd64 runner)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the amd64 image locally first and scan it; nothing is pushed if the scan fails.
      - name: Build (amd64, for scanning)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yardstick:scan
          build-args: |
            YARDSTICK_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for known vulnerabilities (Trivy)
        if: steps.exists.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yardstick:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload the scan to the Security tab
        if: steps.exists.outputs.skip != 'true' && always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Fail on critical vulnerabilities with a fix
        if: steps.exists.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yardstick:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Build and push
        id: push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          cache-from: type=gha
          build-args: |
            YARDSTICK_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            io.yardstick.deb.sha256.amd64=${{ steps.release.outputs.sha256_amd64 }}
            io.yardstick.deb.sha256.arm64=${{ steps.release.outputs.sha256_arm64 }}

      # Sign the pushed image (both tags point at one multi-arch digest). Keyless: Sigstore issues
      # a short-lived certificate to this workflow run via GitHub's OIDC token, and the signature is
      # recorded in the public Rekor log. Verify with `cosign verify` (README).
      - name: Install cosign
        if: steps.exists.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        if: steps.exists.outputs.skip != 'true' && github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA_AMD64: ${{ steps.release.outputs.sha256_amd64 }}
          SHA_ARM64: ${{ steps.release.outputs.sha256_arm64 }}
          SKIP: ${{ steps.exists.outputs.skip }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "Yardstick **$VERSION** (deb sha256 amd64 \`$SHA_AMD64\`, arm64 \`$SHA_ARM64\`), verified against the vendor release list"
            if [ "$EVENT" = "pull_request" ]; then echo "Test build only, **not pushed** (pull request)."
            elif [ "$SKIP" = "true" ]; then echo "\`$IMAGE:$VERSION\` already published, skipped."
            else echo "Built and pushed \`$IMAGE:$VERSION\`."; fi
          } >> "$GITHUB_STEP_SUMMARY"
