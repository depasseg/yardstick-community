# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Test-channel builds for Yardstick testers: same Dockerfile, but from the vendor's
# testing.json, which answers only with a tester's licence key (repository secret
# YARDSTICK_LICENSE, passed to the build as a Docker secret; it never enters the image or the
# log). Published to the PRIVATE package ghcr.io/<owner>/yardstick-testing (test builds are
# licence-gated and not for redistribution). Never runs for pull requests: forks get no secrets.
name: Build (testing channel)

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and push even if the tag already exists"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/yardstick-testing
  RELEASE_URL: https://yardstickhome.com/release/testing.json

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the vendor test release list
        id: release
        env:
          YARDSTICK_LICENSE: ${{ secrets.YARDSTICK_LICENSE }}
        run: |
          set -euo pipefail
          if [ -z "$YARDSTICK_LICENSE" ]; then echo "::error::secret YARDSTICK_LICENSE is not set"; exit 1; fi
          curl -fsSL --retry 3 -A yardstick-community-build -H "X-Yardstick-License: $YARDSTICK_LICENSE" \
            -o release.json "$RELEASE_URL"
          version=$(jq -er .version release.json)
          # Becomes an image tag: a version, optionally with a pre-release suffix (1.2.9-beta.1, 1.3.0rc1).
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+(\.[0-9]+){1,3}([-.]?[A-Za-z][A-Za-z0-9.-]*)?'; then
            echo "::error::unexpected release version: $version"; exit 1
          fi
          for arch in amd64 arm64; do jq -er ".linux.$arch.url, .linux.$arch.sha256, .linux.$arch.signature" release.json >/dev/null; done
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this version already published?
        id: exists
        env:
          FORCE: ${{ inputs.force }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$IMAGE:$VERSION already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (arm64 build on the amd64 runner)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            RELEASE_URL=${{ env.RELEASE_URL }}
            YARDSTICK_VERSION=${{ steps.release.outputs.version }}
          secrets: |
            yardstick_license=${{ secrets.YARDSTICK_LICENSE }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          # No org.opencontainers.image.source label on purpose: linking the package to this
          # public repository would make it public. The package must stay private.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            io.yardstick.channel=testing

      - name: Summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SKIP: ${{ steps.exists.outputs.skip }}
        run: |
          {
            echo "Yardstick testing channel **$VERSION**"
            if [ "$SKIP" = "true" ]; then echo "\`$IMAGE:$VERSION\` already published, skipped."
            else echo "Built and pushed \`$IMAGE:$VERSION\` (private)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
